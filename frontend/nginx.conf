# Configuración de nginx del contenedor web (ver ADR-0011).
# Sirve la interfaz y reenvía /api/ al contenedor api. Es la misma con cualquier
# framework: solo cambia de dónde salen los archivos estáticos (ver Dockerfile).

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con la URL en una variable, nginx vuelve a resolver
    # "api" (cada 10 s) y no se queda con una IP vieja si se recrea el contenedor.
    # También permite que web arranque aunque api todavía no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Llamadas a la API. Con variable y sin ruta en proxy_pass, nginx reenvía la
    # URI completa tal cual: /api/v1/aplicaciones llega igual a la API.
    # Si la API está caída, nginx responde 502 o 504 sin el JSON de error.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Interfaz. Si la ruta no es un archivo, devuelve index.html: así funcionan
    # las rutas de una SPA (React, Angular) al recargar la página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
